# Local preview of the Benoquik store.
# Start:  docker compose up -d      then run:  ./bin/setup.sh   (first time only)
# Open:   http://localhost:8080      Admin: http://localhost:8080/wp-admin  (admin / admin)
# Stop:   docker compose down        (add -v to wipe the database and start fresh)

services:
  db:
    image: mariadb:lts
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
      MARIADB_ROOT_PASSWORD: rootpass
    volumes:
      - db_data:/var/lib/mysql

  wordpress:
    image: wordpress:php8.3-apache
    restart: unless-stopped
    depends_on: [db]
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_CONFIG_EXTRA: |
        define( 'WP_ENVIRONMENT_TYPE', 'local' );
        define( 'BENOQUIK_PRIVATE_DIR', '/var/www/benoquik-private' );
    volumes:
      - wp_data:/var/www/html
      - private_files:/var/www/benoquik-private
      - ./benoquik-theme:/var/www/html/wp-content/themes/benoquik
      - ./benoquik-core:/var/www/html/wp-content/plugins/benoquik-core

  # WP-CLI helper used by ./bin/setup.sh  (runs only on demand)
  cli:
    image: wordpress:cli-php8.3
    profiles: ["cli"]
    user: "33:33"
    depends_on: [db, wordpress]
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
      HOME: /tmp
    volumes:
      - wp_data:/var/www/html
      - private_files:/var/www/benoquik-private
      - ./benoquik-theme:/var/www/html/wp-content/themes/benoquik
      - ./benoquik-core:/var/www/html/wp-content/plugins/benoquik-core
      - ./bin:/bin-scripts:ro
      - ./.cache:/cache:ro

volumes:
  db_data:
  wp_data:
  private_files:
